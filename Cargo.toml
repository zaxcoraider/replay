[workspace]
resolver = "2"
members = [
    "crates/replay-core",
    "crates/replay-api",
    "crates/replay-cli",
    "crates/replay-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
license = "MIT"
authors = ["Your Name <you@example.com>"]
repository = "https://github.com/YOUR_HANDLE/replay"
homepage = "https://replay.dev"
documentation = "https://docs.replay.dev"
description = "Time-travel debugger for Solana transactions"
keywords = ["solana", "debugger", "blockchain", "developer-tools"]
categories = ["development-tools", "api-bindings"]

[workspace.dependencies]
# Solana — keep these as a group, they must version-match litesvm.
# Check https://crates.io/crates/litesvm for the latest compatible versions.
litesvm = "0.6"
solana-sdk = "2.1"
solana-client = "2.1"
solana-transaction-status = "2.1"
solana-program = "2.1"
solana-account-decoder = "2.1"

# Anchor IDL handling
anchor-lang-idl = "0.1"
borsh = "1.5"

# Async + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Web server
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower_governor = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utility
dashmap = "6"
ulid = "1"
flate2 = "1"
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
rustyline = "14"
owo-colors = "4"
indicatif = "0.17"

# Testing
tokio-test = "0.4"
mockito = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2  # dep builds slow in debug mode; bump for sanity
